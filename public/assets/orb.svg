<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <filter id="orb-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Energy Aura -->
  <circle cx="16" cy="16" r="14" fill="#38bdf8" opacity="0.3" filter="url(#orb-glow)"/>
  <circle cx="16" cy="16" r="10" fill="#0284c7" filter="url(#orb-glow)"/>
  <circle cx="16" cy="16" r="7" fill="#38bdf8"/>
  <circle cx="16" cy="16" r="4" fill="#ffffff" filter="url(#orb-glow)"/>

  <!-- Rotating Ring Effect -->
  <ellipse cx="16" cy="16" rx="13" ry="5" fill="none" stroke="#facc15" stroke-width="1.2" transform="rotate(-30 16 16)" opacity="0.85"/>
</svg>
