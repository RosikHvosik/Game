<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="slash-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Energy Arc Slash -->
  <path d="M 8 56 Q 36 38 48 8 Q 32 30 18 46 Z" fill="#fde047" opacity="0.4" filter="url(#slash-glow)"/>
  <path d="M 12 52 Q 36 34 46 12 Q 30 28 18 44 Z" fill="#38bdf8" filter="url(#slash-glow)"/>
  <path d="M 16 48 Q 34 32 44 16 Q 28 26 20 42 Z" fill="#ffffff"/>

  <!-- Sparks -->
  <circle cx="48" cy="8" r="2.5" fill="#ffffff" filter="url(#slash-glow)"/>
  <circle cx="52" cy="14" r="1.5" fill="#fde047"/>
  <circle cx="42" cy="6" r="1.5" fill="#38bdf8"/>
</svg>
