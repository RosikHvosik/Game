<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <filter id="scout-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Wings -->
  <path d="M 8 18 Q -2 4 10 2 Q 18 10 16 26 Z" fill="#c084fc" filter="url(#scout-glow)" opacity="0.9"/>
  <path d="M 40 18 Q 50 4 38 2 Q 30 10 32 26 Z" fill="#c084fc" filter="url(#scout-glow)" opacity="0.9"/>
  <path d="M 10 20 Q 3 10 12 7 Q 17 14 16 26 Z" fill="#f3e8ff"/>
  <path d="M 38 20 Q 45 10 36 7 Q 31 14 32 26 Z" fill="#f3e8ff"/>

  <!-- Spectral Wisps (Lower Body) -->
  <path d="M 18 28 Q 14 42 22 46 Q 24 38 28 44 Q 34 38 30 28 Z" fill="#7e22ce"/>
  <path d="M 20 28 Q 18 38 24 40 Q 26 34 28 38 Q 30 32 28 28 Z" fill="#a855f7"/>

  <!-- Main Body / Head -->
  <circle cx="24" cy="22" r="10" fill="#9333ea"/>
  <circle cx="24" cy="21" r="8" fill="#a855f7"/>

  <!-- Horns / Spikes -->
  <polygon points="18,14 14,6 20,11" fill="#f43f5e" filter="url(#scout-glow)"/>
  <polygon points="30,14 34,6 28,11" fill="#f43f5e" filter="url(#scout-glow)"/>

  <!-- Glowing Eyes -->
  <ellipse cx="20" cy="21" rx="2" ry="3" fill="#f43f5e" filter="url(#scout-glow)"/>
  <ellipse cx="28" cy="21" rx="2" ry="3" fill="#f43f5e" filter="url(#scout-glow)"/>
  <circle cx="20" cy="21" r="1" fill="#ffffff"/>
  <circle cx="28" cy="21" r="1" fill="#ffffff"/>

  <!-- Cursed Rune Mark -->
  <circle cx="24" cy="15" r="1.5" fill="#f472b6" filter="url(#scout-glow)"/>
</svg>
