<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <filter id="gem-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Glowing Aura -->
  <polygon points="16,2 28,16 16,30 4,16" fill="#38bdf8" opacity="0.4" filter="url(#gem-glow)"/>

  <!-- Outer Facets -->
  <polygon points="16,4 26,16 16,28 6,16" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>

  <!-- Inner Diamond Facets -->
  <polygon points="16,4 26,16 16,16" fill="#38bdf8"/>
  <polygon points="16,4 6,16 16,16" fill="#7dd3fc"/>
  <polygon points="16,28 26,16 16,16" fill="#0369a1"/>
  <polygon points="16,28 6,16 16,16" fill="#0284c7"/>

  <!-- Core Sparkle -->
  <circle cx="16" cy="16" r="3" fill="#ffffff" filter="url(#gem-glow)"/>
</svg>
