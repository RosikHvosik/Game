<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Base Dark Stone -->
  <rect width="128" height="128" fill="#131525"/>

  <!-- Flagstone Grid Lines -->
  <rect x="2" y="2" width="60" height="60" fill="#1e1f38" rx="2"/>
  <rect x="66" y="2" width="60" height="60" fill="#1a1b32" rx="2"/>
  <rect x="2" y="66" width="60" height="60" fill="#1a1b32" rx="2"/>
  <rect x="66" y="66" width="60" height="60" fill="#22233f" rx="2"/>

  <!-- Subtle Inner Highlights -->
  <path d="M 4 4 L 60 4 L 4 60 Z" fill="#2d2f54" opacity="0.3"/>
  <path d="M 68 68 L 124 68 L 68 124 Z" fill="#2d2f54" opacity="0.3"/>

  <!-- Runic Center Inset -->
  <circle cx="64" cy="64" r="8" fill="none" stroke="#4338ca" stroke-width="1.5" opacity="0.5"/>
  <polygon points="64,58 68,64 64,70 60,64" fill="#6366f1" opacity="0.3"/>

  <!-- Outer Joint Lines -->
  <line x1="0" y1="64" x2="128" y2="64" stroke="#0a0b14" stroke-width="2"/>
  <line x1="64" y1="0" x2="64" y2="128" stroke="#0a0b14" stroke-width="2"/>
  <rect x="0" y="0" width="128" height="128" fill="none" stroke="#0a0b14" stroke-width="1.5"/>
</svg>
