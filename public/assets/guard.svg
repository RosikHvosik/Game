<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="guard-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Angelic Wings -->
  <path d="M 12 28 Q 0 10 14 6 Q 24 16 22 34 Z" fill="#93c5fd" opacity="0.85" filter="url(#guard-glow)"/>
  <path d="M 52 28 Q 64 10 50 6 Q 40 16 42 34 Z" fill="#93c5fd" opacity="0.85" filter="url(#guard-glow)"/>
  <path d="M 16 30 Q 6 18 16 12 Q 22 20 22 34 Z" fill="#e0f2fe"/>
  <path d="M 48 30 Q 58 18 48 12 Q 42 20 42 34 Z" fill="#e0f2fe"/>

  <!-- Cape / Robes -->
  <path d="M 22 26 Q 16 46 20 54 Q 32 58 44 54 Q 48 46 42 26 Z" fill="#1e3a8a"/>

  <!-- Silver Body Plate -->
  <rect x="23" y="22" width="18" height="24" rx="4" fill="#94a3b8"/>
  <rect x="25" y="24" width="14" height="20" rx="2" fill="#cbd5e1"/>
  <polygon points="32,26 37,33 32,40 27,33" fill="#3b82f6" filter="url(#guard-glow)"/>

  <!-- Legs / Sabatons -->
  <rect x="24" y="46" width="6" height="12" rx="2" fill="#64748b"/>
  <rect x="34" y="46" width="6" height="12" rx="2" fill="#64748b"/>
  <rect x="23" y="54" width="8" height="5" rx="2" fill="#334155"/>
  <rect x="33" y="54" width="8" height="5" rx="2" fill="#334155"/>

  <!-- Helmet -->
  <rect x="25" y="10" width="14" height="15" rx="5" fill="#cbd5e1"/>
  <!-- Visor slit with radiant glow -->
  <rect x="27" y="16" width="10" height="3" rx="1" fill="#38bdf8" filter="url(#guard-glow)"/>
  <!-- Helmet Crest -->
  <polygon points="32,4 35,11 29,11" fill="#facc15"/>

  <!-- Heavy Kite Shield (Left Arm) -->
  <g transform="translate(10, 22)">
    <path d="M 0 0 L 14 0 Q 14 16 7 24 Q 0 16 0 0 Z" fill="#1e40af" stroke="#facc15" stroke-width="2"/>
    <polygon points="7,4 10,9 7,14 4,9" fill="#facc15"/>
  </g>

  <!-- Holy Spear (Right Arm) -->
  <g transform="translate(48, 8)">
    <line x1="0" y1="-8" x2="0" y2="48" stroke="#78350f" stroke-width="2.5"/>
    <!-- Spear Tip -->
    <polygon points="0,-16 5,-6 0,-2 -5,-6" fill="#e0f2fe" filter="url(#guard-glow)"/>
    <polygon points="0,-12 3,-6 0,-4 -3,-6" fill="#60a5fa"/>
  </g>
</svg>
