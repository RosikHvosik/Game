<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 128" width="48" height="128">
  <defs>
    <filter id="bolt-glow" x="-40%" y="-20%" width="180%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Glow -->
  <polyline points="24,0 12,42 28,48 8,92 26,96 16,128" fill="none" stroke="#60a5fa" stroke-width="6" opacity="0.5" filter="url(#bolt-glow)"/>
  <!-- Core Bolt -->
  <polyline points="24,0 14,42 26,48 10,92 24,96 16,128" fill="none" stroke="#e0f2fe" stroke-width="3"/>
  <polyline points="24,0 16,42 24,48 12,92 22,96 16,128" fill="none" stroke="#ffffff" stroke-width="1.5"/>
</svg>
