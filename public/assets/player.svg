<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Broken Halo -->
  <path d="M 22 10 A 10 4 0 0 1 40 9" fill="none" stroke="#fef08a" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="43" cy="10" r="1.5" fill="#fef08a" filter="url(#glow)"/>

  <!-- Cloak / Wings Shadow -->
  <path d="M 18 24 Q 10 40 16 54 Q 28 58 32 54 Q 36 58 48 54 Q 54 40 46 24 Z" fill="#312e81"/>
  <path d="M 20 26 Q 14 38 18 50 Q 28 54 32 50 Q 36 54 46 50 Q 50 38 44 26 Z" fill="#4338ca"/>

  <!-- Body Armor -->
  <rect x="24" y="24" width="16" height="22" rx="4" fill="#d97706"/>
  <rect x="26" y="26" width="12" height="18" rx="2" fill="#f59e0b"/>
  <!-- Chest Crest -->
  <polygon points="32,28 36,34 32,40 28,34" fill="#38bdf8" filter="url(#glow)"/>

  <!-- Belt & Faulds -->
  <rect x="23" y="42" width="18" height="4" rx="1" fill="#78350f"/>
  <rect x="29" y="42" width="6" height="4" fill="#fef08a"/>
  <!-- Legs / Boots -->
  <rect x="24" y="46" width="6" height="12" rx="2" fill="#92400e"/>
  <rect x="34" y="46" width="6" height="12" rx="2" fill="#92400e"/>
  <rect x="23" y="54" width="8" height="5" rx="2" fill="#451a03"/>
  <rect x="33" y="54" width="8" height="5" rx="2" fill="#451a03"/>

  <!-- Head & Hair -->
  <circle cx="32" cy="18" r="8" fill="#fde68a"/>
  <!-- Hair locks -->
  <path d="M 24 16 Q 32 10 40 16 Q 36 22 32 20 Q 28 22 24 16 Z" fill="#fef08a"/>
  <path d="M 22 17 Q 24 23 26 21" stroke="#fef08a" stroke-width="2" fill="none"/>
  <path d="M 42 17 Q 40 23 38 21" stroke="#fef08a" stroke-width="2" fill="none"/>
  <!-- Eyes -->
  <circle cx="29" cy="18" r="1.2" fill="#0284c7"/>
  <circle cx="35" cy="18" r="1.2" fill="#0284c7"/>

  <!-- Shoulders / Pauldrons -->
  <circle cx="21" cy="26" r="5" fill="#f59e0b"/>
  <circle cx="21" cy="26" r="3" fill="#fef08a"/>
  <circle cx="43" cy="26" r="5" fill="#f59e0b"/>
  <circle cx="43" cy="26" r="3" fill="#fef08a"/>

  <!-- Runeblade (Sword in Hand) -->
  <g transform="translate(44, 22) rotate(20)">
    <!-- Hilt -->
    <rect x="-2" y="10" width="4" height="8" rx="1" fill="#78350f"/>
    <rect x="-6" y="8" width="12" height="3" rx="1" fill="#fef08a"/>
    <circle cx="0" cy="19" r="2" fill="#fef08a"/>
    <!-- Glowing Blade -->
    <polygon points="-3,8 0,-24 3,8" fill="#e0f2fe" filter="url(#glow)"/>
    <line x1="0" y1="6" x2="0" y2="-18" stroke="#38bdf8" stroke-width="1.5"/>
  </g>
</svg>
